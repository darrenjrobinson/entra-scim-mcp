name: Release

# Tag-driven. `npm version <patch|minor|major>` in node/ writes the version into
# package.json, package-lock.json and server.json (the `version` lifecycle
# script), commits and tags it; pushing that tag runs this.
#
#   cd node && npm version minor && git push --follow-tags
#
# workflow_dispatch exists to re-run a release that failed partway, and GitHub
# lets a manual run target a tag. It cannot be used to publish an untagged
# branch: the first step of `verify` refuses any ref that is not a v* tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: node

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    steps:
      # Must come first, and must gate everything: a workflow_dispatch can name
      # any ref, and check-version-sync only compares against refs beginning
      # with "v" — so a manual run from a branch would otherwise sail past the
      # version check and publish whatever package.json happened to say.
      - name: Refuse anything that is not a version tag
        working-directory: .
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release runs only from a tag. Got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'."
            exit 1
          fi
          case "${GITHUB_REF_NAME}" in
            v*) echo "Releasing from tag ${GITHUB_REF_NAME}" ;;
            *)
              echo "::error::'${GITHUB_REF_NAME}' is not a v* version tag."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - run: npm ci

      # Everything CI runs, again. A tag is the last place to find out that
      # master was green and the tagged commit is not.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage

      # The tag, package.json, package-lock.json and server.json must all name
      # the same version. Getting this wrong publishes an npm package under one
      # version and a registry entry pointing at another.
      - name: Check the version is consistent with the tag
        run: npm run check:version -- "${GITHUB_REF_NAME}"

      # The registry validates server.json server-side and rejects things a
      # JSON schema alone would not — description has a 100-character limit,
      # which this repo's first draft exceeded. Far better here than after the
      # npm publish below, which cannot be taken back.
      - name: Validate server.json against the MCP Registry
        working-directory: .
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate

  # Split from the registry publish on purpose. npm versions are immutable, so
  # if these were one job, any failure after the publish left the release
  # permanently unrepeatable: a re-run would die on "cannot publish over an
  # existing version" and never reach the registry. Two jobs means GitHub's
  # "re-run failed jobs" retries only the half that failed.
  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the OIDC token IS the credential, so there is
      # no NPM_TOKEN to hold or rotate. npm authorises the publish by matching
      # the token's repo and workflow filename against the trusted publisher
      # configured on the package, and mints provenance from the same token.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1. Node 22 bundles 10.9.x,
      # which has no OIDC support at all: it would ignore the token, look for
      # an _authToken it will not find, and fail with a 404 on the PUT. Placed
      # before `npm ci` so the install runs on npm 11 as well.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # Idempotent: skipped only when this exact version is already on npm, so
      # re-running after a downstream failure is a no-op here instead of a hard
      # error. `npm view` is checked for the exact version rather than by exit
      # code, which is 0 with empty output when the package exists but the
      # version does not.
      #
      # No --access and no --provenance. The name is unscoped so public is the
      # default (publishConfig pins it regardless), and trusted publishing
      # attaches the provenance attestation on its own.
      - name: Publish to npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION is already published; skipping so a retry can reach the registry."
            exit 0
          fi
          npm publish

  publish-registry:
    name: Publish to the MCP Registry
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login; no secret involved
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The registry verifies ownership by fetching package.json from npm and
      # comparing its `mcpName` to the server name, so the version has to be
      # served before this runs. A fresh publish is not instantly visible.
      - name: Wait for npm to serve the new version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 30); do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "$NAME@$VERSION is live on npm"
              exit 0
            fi
            echo "attempt $attempt: not visible yet, waiting 10s"
            sleep 10
          done
          echo "::error::$NAME@$VERSION never became visible on npm"
          exit 1

      - name: Install mcp-publisher
        working-directory: .
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # OIDC proves this workflow runs in darrenjrobinson/entra-scim-mcp, which
      # is what authorises the io.github.darrenjrobinson/* namespace.
      - name: Authenticate to the MCP Registry
        working-directory: .
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        working-directory: .
        run: ./mcp-publisher publish
