# Version-update PRs only. Security alerts are a repository setting
# (Settings > Code security > Dependabot alerts) and are already enabled.
#
# The npm package lives in node/, not at the repo root, so the npm directory
# is /node. GitHub Actions workflows are at the root as usual.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7 cannot be installed here: typescript-eslint pins a peer of
    # typescript ">=4.8.4 <6.1.0", still true in 8.70.0, its newest release. An
    # offered bump to 7.x fails `npm ci` with ERESOLVE, which kills every CI
    # job before it runs and blocks the six other updates grouped with it.
    # Scoped to >=7 rather than all majors so a TypeScript 6 bump, which the
    # linter does accept, still comes through. Drop this once typescript-eslint
    # widens the range.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
